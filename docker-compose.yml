version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/migrations_cases.db
      - ALLOWED_ORIGINS=http://localhost:5173
    env_file:
      - ./backend/.env
    restart: unless-stopped
